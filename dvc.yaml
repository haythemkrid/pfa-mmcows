stages:
  visual_prepare_yolo:
    cmd: >
      python -m src.visual.data.a2_yolo_binary
      --dataset-root store/data/raw/visual_data
      --remap-labels-in-place
    deps:
    - src/visual/data/a2_yolo_binary.py
    - store/data/raw/visual_data/dataset_index.pkl
    outs:
    - store/data/raw/visual_data/yolo_nano/train.txt
    - store/data/raw/visual_data/yolo_nano/val.txt
    - store/data/raw/visual_data/yolo_nano/test.txt
    - store/data/raw/visual_data/yolo_nano/mmcows_binary.yaml

  visual_train:
    cmd: >
      python -m src.visual.models.train
      --data-yaml store/data/raw/visual_data/yolo_nano/mmcows_binary.yaml
      --model yolov8n.pt
      --epochs 50
      --imgsz 640
      --batch 16
      --device cpu
      --workers 4
      --project store/models/visual
      --name cow_detection_v8n
    deps:
    - src/visual/models/train.py
    - store/data/raw/visual_data/yolo_nano/mmcows_binary.yaml
    - store/data/raw/visual_data/yolo_nano/train.txt
    - store/data/raw/visual_data/yolo_nano/val.txt
    outs:
    - store/models/visual
